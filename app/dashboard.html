<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 13 Monitoring Dashboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e9f1f4; background: #102027; }
    body { margin: 0; padding: 24px; }
    header { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: end; margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0; color: #a9bec6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 16px; }
    .panel { background: #19313a; border: 1px solid #31515d; border-radius: 12px; padding: 18px; min-width: 0; }
    .panel h2 { margin: 0; font-size: 18px; }
    .meta { color: #a9bec6; margin: 6px 0 14px; font-size: 13px; }
    .metrics { display: flex; flex-wrap: wrap; gap: 10px 18px; min-height: 48px; }
    .metric { display: grid; gap: 2px; }
    .metric strong { font-size: 20px; font-variant-numeric: tabular-nums; }
    .metric span { color: #a9bec6; font-size: 12px; }
    svg { width: 100%; height: 160px; overflow: visible; margin-top: 14px; }
    .threshold { stroke: #f3b76b; stroke-dasharray: 5 4; stroke-width: 1.5; }
    .line { fill: none; stroke: #66d9c3; stroke-width: 2.5; }
    .axis { stroke: #54727d; stroke-width: 1; }
    .chart-label { fill: #a9bec6; font-size: 11px; }
    #status { text-align: right; }
    @media (max-width: 500px) { body { padding: 14px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Monitoring &amp; LLMOps</h1><p id="subtitle">Loading 60-minute view…</p></div>
    <p id="status" aria-live="polite"></p>
  </header>
  <main id="panels" class="grid"></main>
  <script>
    const labels = { lte: '≤', gte: '≥' };
    const svgNS = 'http://www.w3.org/2000/svg';
    function element(name, attrs = {}) {
      const node = document.createElementNS(svgNS, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    }
    function format(value) {
      if (value === null || value === undefined) return '—';
      if (typeof value === 'number') return Number.isInteger(value) ? value.toLocaleString() : value.toLocaleString(undefined, { maximumFractionDigits: 6 });
      return String(value);
    }
    function drawChart(svg, panel) {
      const width = 500, height = 160, left = 36, right = 12, top = 12, bottom = 24;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      const values = panel.series.map(point => point.value);
      const visible = values.filter(value => typeof value === 'number');
      const threshold = Number(panel.threshold.value);
      const max = Math.max(threshold, ...visible, 0.001) * 1.1;
      const y = value => top + (height - top - bottom) * (1 - value / max);
      const x = index => left + (width - left - right) * index / Math.max(1, values.length - 1);
      svg.append(element('line', { x1: left, y1: height - bottom, x2: width - right, y2: height - bottom, class: 'axis' }));
      svg.append(element('line', { x1: left, y1: y(threshold), x2: width - right, y2: y(threshold), class: 'threshold' }));
      const thresholdLabel = element('text', { x: left + 4, y: Math.max(10, y(threshold) - 4), class: 'chart-label' });
      thresholdLabel.textContent = `threshold ${format(threshold)}`;
      svg.append(thresholdLabel);
      let points = [];
      function flush() {
        if (points.length) svg.append(element('polyline', { points: points.join(' '), class: 'line' }));
        points = [];
      }
      values.forEach((value, index) => {
        if (typeof value === 'number') {
          points.push(`${x(index)},${y(value)}`);
          svg.append(element('circle', { cx: x(index), cy: y(value), r: 2.5, fill: '#66d9c3' }));
        } else flush();
      });
      flush();
      const start = element('text', { x: left, y: height - 5, class: 'chart-label' });
      start.textContent = '−60 min';
      svg.append(start);
      const end = element('text', { x: width - right, y: height - 5, 'text-anchor': 'end', class: 'chart-label' });
      end.textContent = 'now';
      svg.append(end);
    }
    function render(data) {
      document.getElementById('subtitle').textContent = `Last ${data.time_range_minutes} min · source: ${data.source} · refresh ${data.refresh_seconds}s`;
      document.getElementById('status').textContent = `Updated ${new Date(data.generated_at).toLocaleTimeString()}`;
      const container = document.getElementById('panels');
      container.replaceChildren();
      for (const panel of data.panels) {
        const card = document.createElement('section'); card.className = 'panel';
        const title = document.createElement('h2'); title.textContent = panel.title; card.append(title);
        const meta = document.createElement('p'); meta.className = 'meta';
        meta.textContent = `${panel.unit} · ${panel.threshold.aggregation} ${labels[panel.threshold.operator]} ${format(panel.threshold.value)}`;
        card.append(meta);
        const metrics = document.createElement('div'); metrics.className = 'metrics';
        for (const metric of panel.metrics) {
          const block = document.createElement('div'); block.className = 'metric';
          const value = document.createElement('strong'); value.textContent = format(metric.value);
          const label = document.createElement('span'); label.textContent = metric.label;
          block.append(value, label); metrics.append(block);
        }
        card.append(metrics);
        const svg = element('svg', { role: 'img', 'aria-label': `${panel.title} over the last hour` });
        drawChart(svg, panel); card.append(svg); container.append(card);
      }
    }
    async function refresh() {
      try {
        const response = await fetch('/dashboard/data', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        document.getElementById('status').textContent = `Dashboard error: ${error.message}`;
      }
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
