service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Mỗi request_received là một request; response_sent trong 3000ms là good event. Với 10,000 request trong 28 ngày, error budget 0.5% cho phép tối đa 50 request lỗi hoặc chậm hơn 3000ms. Ngưỡng 3000ms cao hơn latency P95 của baseline load test, để nhận diện suy giảm rõ rệt.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
